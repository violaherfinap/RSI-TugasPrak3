version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: docker-rsi-tugas-3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: acara_rsi
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: